<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="在浏览器中预览数据、调整统计配置，生成可交互的数据画像报告。支持 CSV、JSON 与 Parquet。" />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" type="image/svg+xml" href="./antv.svg" />
    <title>Data Profiling · 数据画像实验室</title>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10M15 10v10"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M9 15v-4M14 15V7M19 15v-6"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 11-2l3 3M4 16l3 3a7 7 0 0 0 11-2"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
      <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6c-2-2-5-2-9-2v14c4 0 7 0 9 2 2-2 5-2 9-2V4c-4 0-7 0-9 2v14"/></symbol>
      <symbol id="icon-github" viewBox="0 0 24 24"><path d="M9 19c-4 1.3-4-2-6-2.5m12 5v-3.4c0-1 .1-1.4-.5-2 3-.3 6-1.5 6-6.5A4.9 4.9 0 0 0 19 6c.1-.3.6-1.7-.2-3.6 0 0-1.2-.3-3.8 1.4a13 13 0 0 0-6 0C6.4 2.1 5.2 2.4 5.2 2.4 4.4 4.3 4.9 5.7 5 6a4.9 4.9 0 0 0-1.5 3.6c0 5 3 6.2 6 6.5-.6.6-.5 1.2-.5 2v3.4"/></symbol>
    </svg>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./"><span class="brand-mark"><svg aria-hidden="true"><use href="#icon-chart"/></svg></span><h1>数据画像</h1></a>
        <span class="privacy" title="文件不会离开你的设备"><svg aria-hidden="true"><use href="#icon-shield"/></svg>本机处理</span>
        <nav class="header-nav" aria-label="项目链接">
          <a class="icon-button" href="https://github.com/antvis/data-profiling/blob/main/README.zh-CN.md" target="_blank" rel="noreferrer" aria-label="使用文档" title="使用文档"><svg aria-hidden="true"><use href="#icon-book"/></svg></a>
          <a class="icon-button" href="https://github.com/antvis/data-profiling" target="_blank" rel="noreferrer" aria-label="GitHub" title="GitHub"><svg aria-hidden="true"><use href="#icon-github"/></svg></a>
        </nav>
      </div>
    </header>
    <main id="playground">
      <div id="error" class="error" role="alert" hidden></div>
      <div class="workspace" aria-busy="true">
        <section class="panel data-panel" id="drop-zone" aria-labelledby="data-heading">
          <div class="panel-header">
            <div class="panel-title"><svg aria-hidden="true"><use href="#icon-table"/></svg><h2 id="data-heading">数据预览</h2></div>
            <label class="button button-primary upload-button" id="upload-label" title="支持拖放 · CSV、JSON、Parquet · 最大 20 MB · 最多 200 列">
              <svg aria-hidden="true"><use href="#icon-upload"/></svg>上传数据
              <input id="file" type="file" accept=".csv,.json,.parquet" data-query-control aria-label="上传数据" aria-describedby="upload-formats"/>
            </label>
            <span class="visually-hidden" id="upload-formats">支持 CSV、JSON、Parquet，最大 20 MB，最多 200 列。也可拖放至数据预览。</span>
          </div>
          <div class="data-summary">
            <span class="file-mark">CSV</span><div class="dataset-info"><strong id="dataset-name">电商订单 · 预设数据</strong><span id="dataset-meta"></span></div>
            <button id="restore" class="button icon-button" data-query-control aria-label="恢复示例数据" title="恢复示例数据"><svg aria-hidden="true"><use href="#icon-refresh"/></svg></button>
          </div>
          <div class="table-area" tabindex="0" aria-label="数据明细，可横向滚动">
            <table id="preview"><thead></thead><tbody></tbody></table>
            <div id="data-empty" class="data-loading"><span class="spinner" aria-hidden="true"></span>载入数据…</div>
          </div>
          <div class="preview-footer">
            <span id="row-range"></span>
            <div class="pagination"><button id="previous" aria-label="上一页" disabled><svg aria-hidden="true"><use href="#icon-chevron"/></svg></button><span id="page">1 / 1</span><button id="next" aria-label="下一页" disabled><svg aria-hidden="true"><use href="#icon-chevron"/></svg></button></div>
          </div>
          <div class="drag-overlay" aria-hidden="true"><svg><use href="#icon-upload"/></svg><strong>松开以上传</strong></div>
        </section>
        <section class="panel report-panel" aria-labelledby="report-heading">
          <div class="panel-header">
            <div class="panel-title"><svg aria-hidden="true"><use href="#icon-chart"/></svg><h2 id="report-heading">画像报告</h2><span id="report-state" class="state" hidden></span></div>
            <button id="download" class="button" disabled><svg aria-hidden="true"><use href="#icon-download"/></svg>导出 HTML</button>
          </div>
          <details class="report-settings">
            <summary>
              <svg aria-hidden="true"><use href="#icon-settings"/></svg>报告设置
              <span id="mode-summary">常用统计</span><svg class="settings-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
            </summary>
            <div class="settings-content">
              <div class="settings-grid">
                <label class="setting-field"><span>统计范围</span><select id="mode" data-query-control><option value="overview">常用统计</option><option value="detailed">详细统计</option><option value="full">全量统计（本机）</option></select></label>
                <label class="setting-field"><span>直方图分箱</span><select id="bins" data-query-control><option value="0">自动分箱</option><option value="10">10 个分箱</option><option value="20" selected>20 个分箱</option><option value="30">30 个分箱</option><option value="50">50 个分箱</option></select></label>
                <label class="setting-field"><span>报告语言</span><select id="language" data-query-control><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
                <label class="setting-field"><span>外观</span><select id="theme" data-query-control><option value="light">明亮</option><option value="dark">深色</option><option value="auto">跟随系统</option></select></label>
              </div>
              <section id="full-settings" class="full-settings" aria-label="全量统计配置" hidden>
                <div class="settings-grid">
                  <label class="setting-field"><span>时间索引</span><select id="time-index" data-query-control><option value="">不指定</option></select></label>
                  <label class="setting-field"><span>排序列</span><select id="order-by" data-query-control><option value="">按时间索引排序</option></select></label>
                </div>
                <details class="role-settings" id="role-settings">
                  <summary>列角色</summary>
                  <p>文件与图像路径须位于本机引擎的数据目录内。</p>
                  <div class="settings-grid role-fields" id="role-fields"></div>
                </details>
                <div class="settings-links">
                  <a href="https://github.com/antvis/data-profiling/blob/main/README.zh-CN.md#本机全量统计" target="_blank" rel="noreferrer">安装指南</a>
                  <a id="local-playground" href="http://127.0.0.1:5174/" target="_blank" rel="noreferrer">打开本机体验页</a>
                </div>
              </section>
              <label class="toggle" id="correlation-control" title="最多 20 个数值列"><input id="correlations" type="checkbox" checked data-query-control aria-describedby="correlation-limit"/>相关性分析<span id="correlation-limit" class="visually-hidden">最多 20 个数值列</span></label>
              <div class="settings-actions">
                <a href="https://github.com/antvis/data-profiling/blob/main/docs/metrics.md" target="_blank" rel="noreferrer">指标目录</a>
                <button id="recompute" class="button button-primary" data-query-control>重新生成</button>
              </div>
            </div>
          </details>
          <div class="report-body">
            <iframe id="report" title="数据画像报告预览" sandbox="allow-same-origin" hidden></iframe>
            <div id="report-loading" class="report-loading" role="status"><svg aria-hidden="true"><use href="#icon-chart"/></svg><span id="loading-message">正在生成报告…</span></div>
          </div>
        </section>
      </div>
      <span id="execution-status" class="visually-hidden" role="status"></span>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
